<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="消さずに書く。考えを流す。時間を決めて、書くことだけに集中するシンプルなフリーライティングアプリ。">
  <meta name="theme-color" content="#ffffff">
  <title>FreeWriting — 消さずに書く。</title>
  <link rel="icon" href="./icons/edit_note.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./layout.css">
  <script src="./app.js" defer></script>
</head>
<body data-state="ready">
  <header class="site-header">
    <a href="./" class="wordmark" aria-label="FreeWriting ホーム">FreeWriting</a>
  </header>

  <main>
    <section class="writing" aria-label="フリーライティング">
      <div class="timer-area">
        <div class="timer" id="timer">
          <div id="time-setting" class="time-setting">
            <label class="minute-entry" title="クリックして入力、上下にドラッグして変更">
              <input id="minutes" type="text" inputmode="numeric" pattern="[0-9]*" value="3" maxlength="3" role="spinbutton" aria-valuemin="1" aria-valuemax="180" aria-valuenow="3" aria-label="ライティング時間（分）" autocomplete="off">
              <span class="unit">分</span>
            </label>
            <div class="stepper">
              <button id="increase" class="icon-button" aria-label="1分増やす" type="button"><img src="./icons/keyboard_arrow_up.svg" alt="" width="20" height="20"></button>
              <button id="decrease" class="icon-button" aria-label="1分減らす" type="button"><img src="./icons/keyboard_arrow_down.svg" alt="" width="20" height="20"></button>
            </div>
          </div>
          <div id="time-remaining" class="time-remaining" role="timer" aria-label="残り時間" hidden>
            <span id="remaining-minutes">03</span><span class="colon">:</span><span id="remaining-seconds">00</span>
          </div>
          <svg class="timer-line" viewBox="0 0 180 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="180" height="2" fill="#e9e9e9"></rect>
            <rect id="progress-line" width="180" height="2" fill="#555555"></rect>
          </svg>
        </div>
      </div>

      <div class="paper-top">
        <button id="stop" class="icon-button" type="button" aria-label="執筆を中止して文章を残す" title="中止して文章を残す（Escを2回）" hidden><img src="./icons/close.svg" alt="" width="20" height="20"></button>
      </div>
      <div class="paper" id="paper">
        <button id="start" class="start-button" type="button">
          <span class="start-title">開始</span>
        </button>
        <textarea id="editor" aria-label="執筆欄（確定した文字は削除できません）" spellcheck="false" autocapitalize="off" autocomplete="off" hidden></textarea>
      </div>

      <div id="result-actions" class="result-actions" hidden>
        <button id="restart" class="icon-button" type="button" aria-label="もう一度書く" title="もう一度書く"><img src="./icons/replay.svg" width="20" height="20" alt=""></button>
        <div class="export-actions">
          <button id="copy" class="icon-button" type="button" aria-label="文章をコピー" title="コピー"><img src="./icons/content_copy.svg" width="19" height="19" alt=""></button>
          <button id="save-open" class="icon-button" type="button" aria-label="文章を保存" title="保存"><img src="./icons/download.svg" width="20" height="20" alt=""></button>
        </div>
      </div>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="save-dialog" aria-labelledby="save-title">
    <form method="dialog"><button class="icon-button dialog-close" aria-label="閉じる"><img src="./icons/close.svg" width="22" height="22" alt=""></button></form>
    <h2 id="save-title">保存</h2>
    <form id="save-form">
      <label for="filename">ファイル名</label>
      <input id="filename" name="filename" type="text" maxlength="120" required autocomplete="off">
      <button class="plain-button" type="submit"><img src="./icons/download.svg" width="20" height="20" alt="">ダウンロード</button>
    </form>
  </dialog>
  <noscript><p>このアプリのタイマーと執筆機能にはJavaScriptが必要です。</p></noscript>
</body>
</html>
