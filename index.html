<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="暇な時にやりましょう">
  <meta name="theme-color" content="#ffffff">
  <title>FreeWriting</title>
  <link rel="icon" href="./icons/edit_note.svg" type="image/svg+xml">
  <link rel="preload" href="./fonts/BIZUDGothic-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./layout.css">
  <script src="./app.js" defer></script>
</head>
<body data-state="ready">
  <header class="site-header">
    <a href="./" class="wordmark" aria-label="FreeWriting ホーム">FreeWriting</a>
  </header>

  <main>
    <section class="writing" aria-label="フリーライティング">
      <div class="timer-area">
        <div class="timer" id="timer">
          <div class="timer-display">
            <div id="time-setting" class="time-setting">
              <div class="minute-controls">
                <label class="minute-entry" title="クリックして入力、上下ドラッグ／ホイールで変更">
                  <input id="minutes" type="text" inputmode="numeric" pattern="[0-9]*" value="3" maxlength="3" role="spinbutton" aria-valuemin="1" aria-valuemax="180" aria-valuenow="3" aria-label="ライティング時間（分）" autocomplete="off">
                  <span class="unit">分</span>
                </label>
                <div class="stepper">
                  <button id="increase" class="icon-button" aria-label="1分増やす" type="button"><img src="./icons/keyboard_arrow_up.svg" alt="" width="20" height="20"></button>
                  <button id="decrease" class="icon-button" aria-label="1分減らす" type="button"><img src="./icons/keyboard_arrow_down.svg" alt="" width="20" height="20"></button>
                </div>
              </div>
            </div>
            <div id="time-remaining" class="time-remaining" role="timer" aria-label="残り時間" aria-hidden="true" inert>
              <span id="remaining-minutes">03</span><span class="colon">:</span><span id="remaining-seconds">00</span>
            </div>
          </div>
          <svg class="timer-line" viewBox="0 0 180 2" preserveAspectRatio="none" aria-hidden="true">
            <rect width="180" height="2" fill="#e9e9e9"></rect>
            <rect id="progress-line" width="180" height="2" fill="#555555"></rect>
          </svg>
        </div>
      </div>

      <div class="paper-top">
        <label id="timer-option" class="timer-option" title="執筆中のタイマーを非表示" aria-label="執筆中のタイマーを非表示">
          <input id="hide-timer" type="checkbox" aria-label="執筆中のタイマーを非表示">
          <img id="timer-visibility-icon" src="./icons/visibility.svg" alt="" width="18" height="18">
        </label>
        <button id="stop" class="icon-button" type="button" aria-label="執筆を中止して文章を残す" title="中止して文章を残す（Escを2回）" hidden><img src="./icons/close.svg" alt="" width="20" height="20"></button>
      </div>
      <div class="paper" id="paper">
        <button id="start" class="start-button" type="button">
          <span class="start-title">開始</span>
        </button>
        <textarea id="editor" aria-label="執筆欄（確定した文字は削除できません）" spellcheck="false" autocapitalize="off" autocomplete="off" hidden></textarea>
      </div>

      <div id="result-actions" class="result-actions" hidden>
        <button id="restart" class="icon-button" type="button" aria-label="もう一度書く" title="もう一度書く"><img src="./icons/replay.svg" width="20" height="20" alt=""></button>
        <div class="export-actions">
          <button id="obsidian-save" class="icon-button" type="button" aria-label="Obsidianに保存" title="Obsidianに保存"><img src="./icons/obsidian.svg" width="20" height="20" alt=""></button>
          <button id="obsidian-settings" class="icon-button" type="button" aria-label="Obsidianの設定" title="Obsidianの設定"><img src="./icons/settings.svg" width="20" height="20" alt=""></button>
          <button id="copy" class="icon-button" type="button" aria-label="文章をコピー" title="コピー"><img src="./icons/content_copy.svg" width="19" height="19" alt=""></button>
          <button id="save-open" class="icon-button" type="button" aria-label="文章を保存" title="保存"><img src="./icons/download.svg" width="20" height="20" alt=""></button>
        </div>
      </div>
      <div id="obsidian-feedback" class="export-feedback" hidden>
        <p id="obsidian-message" role="status" aria-live="polite"></p>
        <div class="feedback-actions">
          <a id="obsidian-retry" class="icon-button" aria-label="もう一度Obsidianを開く" title="もう一度Obsidianを開く"><img src="./icons/replay.svg" width="20" height="20" alt=""></a>
          <button id="obsidian-download" class="icon-button" type="button" aria-label="Markdownをダウンロード" title="Markdownをダウンロード"><img src="./icons/download.svg" width="20" height="20" alt=""></button>
        </div>
      </div>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="save-dialog" aria-labelledby="save-title">
    <form method="dialog"><button class="icon-button dialog-close" aria-label="閉じる"><img src="./icons/close.svg" width="22" height="22" alt=""></button></form>
    <h2 id="save-title">保存</h2>
    <form id="save-form">
      <label for="filename">ファイル名</label>
      <input id="filename" name="filename" type="text" maxlength="120" required autocomplete="off">
      <button class="plain-button" type="submit"><img src="./icons/download.svg" width="20" height="20" alt="">ダウンロード</button>
    </form>
  </dialog>
  <dialog id="obsidian-dialog" aria-labelledby="obsidian-title" aria-describedby="obsidian-help">
    <form method="dialog"><button class="icon-button dialog-close" aria-label="閉じる"><img src="./icons/close.svg" width="22" height="22" alt=""></button></form>
    <h2 id="obsidian-title">Obsidianの設定</h2>
    <p id="obsidian-help" class="dialog-help">Obsidianをインストールし、保存先のVaultを一度開いてください。</p>
    <form id="obsidian-form" class="settings-form">
      <label for="obsidian-vault">Vault名（またはVault ID）</label>
      <input id="obsidian-vault" type="text" required maxlength="200" autocomplete="off" aria-describedby="obsidian-vault-help">
      <p id="obsidian-vault-help" class="dialog-help">Obsidianに表示される名前を入力します。</p>
      <label for="obsidian-folder">保存先フォルダー（任意・Vault内）</label>
      <input id="obsidian-folder" type="text" maxlength="200" placeholder="例: FreeWriting" autocomplete="off">
      <p class="dialog-help">空欄はVault直下。設定はこのブラウザーに保存します。</p>
      <p id="obsidian-settings-message" class="dialog-help" role="status" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="obsidian-test" class="plain-button" type="button">起動テスト</button>
        <button id="obsidian-settings-submit" class="plain-button" type="submit">設定を保存</button>
      </div>
    </form>
  </dialog>
  <dialog id="obsidian-long-dialog" aria-labelledby="obsidian-long-title" aria-describedby="obsidian-long-help">
    <form method="dialog"><button class="icon-button dialog-close" aria-label="閉じる"><img src="./icons/close.svg" width="22" height="22" alt=""></button></form>
    <h2 id="obsidian-long-title">長文をObsidianへ渡す</h2>
    <p id="obsidian-long-help" class="dialog-help">本文をコピーしてからObsidianを開きます。クリップボードを置き換えるため、保存するまでは別の内容をコピーしないでください。</p>
    <div class="dialog-actions">
      <button id="obsidian-copy-long" class="plain-button" type="button">1. 本文をコピー</button>
      <a id="obsidian-open-long" class="plain-button" hidden>2. Obsidianを開く</a>
    </div>
    <p id="obsidian-long-message" class="dialog-help" role="status" aria-live="polite"></p>
    <button id="obsidian-download-long" class="icon-button text-button" type="button">Markdownをダウンロード</button>
  </dialog>
  <noscript><p>このアプリのタイマーと執筆機能にはJavaScriptが必要です。</p></noscript>
</body>
</html>
